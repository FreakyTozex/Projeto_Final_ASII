name: Rede-Social

services:
  app:
    build: .
    ports:
      - 9000:8000
    env_file: Rede-Social\.env
    develop:
      watch:
        - action: sync
          path: ./Rede-Social
          target: /usr/src/app
          initial_sync: true
          ignore:
            - virtualenv
            
        - action: rebuild
          path: requirements.txt
